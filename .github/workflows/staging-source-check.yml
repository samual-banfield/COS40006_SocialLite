# Ensures that only Development may be merged into Staging.
#
# Posts a commit status called "Staging source check" on every PR into Staging:
#   - head branch is Development (in this repo) -> success
#   - anything else (feature branch, fork)      -> failure, and the PR is closed

name: Staging source check

on:
    pull_request_target:
        branches: [Staging]
        types: [opened, reopened, synchronize, edited]

permissions:
    statuses: write
    pull-requests: write

jobs:
    verify-source:
        runs-on: ubuntu-latest
        steps:
            - name: Only allow PRs from Development
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR: ${{ github.event.pull_request.number }}
              run: |
                  set -euo pipefail

                  if [ "$HEAD_REF" = "Development" ] && [ "$HEAD_REPO" = "$GH_REPO" ]; then
                    gh api "repos/$GH_REPO/statuses/$HEAD_SHA" \
                      -f state=success -f context="Staging source check" \
                      -f description="Source branch is Development"
                    echo "PR #$PR comes from Development. OK."
                    exit 0
                  fi

                  gh api "repos/$GH_REPO/statuses/$HEAD_SHA" \
                    -f state=failure -f context="Staging source check" \
                    -f description="Only Development can be merged into Staging"

                  gh pr close "$PR" --comment "Closed automatically: only \`Development\` can be merged into \`Staging\`. Please open your PR against \`Development\` instead; it will be promoted to Staging once merged."

                  echo "::error::PR #$PR targets Staging from '$HEAD_REF'. Only Development may be merged into Staging."
                  exit 1
