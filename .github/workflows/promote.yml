# Promotion flow:
#   feature branch --(PR, team lead approves)-------> Development
#   Development    --(auto PR + auto merge)---------> Staging
#   Staging        --(auto PR, team lead approves)--> Production
#
# Everything runs in this one workflow on purpose: a merge done with the
# built-in GITHUB_TOKEN does NOT trigger other workflows, so a separate
# "on push to Staging" workflow would never fire after the auto-merge.

name: Promote branches

on:
  push:
    branches: [Development, Staging]
  workflow_dispatch: # lets you re-run a promotion by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write
  statuses: write

# Never run two promotions at the same time
concurrency:
  group: promote-branches
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  promote-to-staging:
    name: Development → Staging (auto-merge)
    if: github.ref_name == 'Development'
    runs-on: ubuntu-latest
    steps:
      - name: Open and merge PR into Staging
        run: |
          set -euo pipefail

          ahead=$(gh api "repos/$GH_REPO/compare/Staging...Development" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "Staging already has everything in Development. Nothing to promote."
            exit 0
          fi

          # Reuse an open promotion PR if there is one, otherwise create it
          pr=$(gh pr list --base Staging --head Development --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr_url=$(gh pr create --base Staging --head Development \
              --title "Promote Development → Staging" \
              --body "Automated promotion of Development @ ${GITHUB_SHA::7}. Auto-merged by the Promote branches workflow.")
            pr="${pr_url##*/}"
            echo "Opened PR #$pr"
          fi

          # PRs opened with GITHUB_TOKEN don't trigger the staging-source-check
          # workflow, so post the required "Staging source check" status here.
          head_sha=$(gh pr view "$pr" --json headRefOid --jq '.headRefOid')
          gh api "repos/$GH_REPO/statuses/$head_sha" \
            -f state=success -f context="Staging source check" \
            -f description="Opened by the promotion workflow from Development" > /dev/null

          # GitHub needs a few seconds to work out mergeability, so retry briefly.
          # Merge commit (not squash/rebase) keeps the branch histories aligned.
          # No --delete-branch: the head branch is Development itself.
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$pr" --merge --subject "Promote Development to Staging (${GITHUB_SHA::7})"; then
              echo "Merged PR #$pr into Staging."
              exit 0
            fi
            echo "PR #$pr not mergeable yet (attempt $attempt). Retrying in 10s..."
            sleep 10
          done

          echo "::error::Could not merge PR #$pr into Staging. Check the PR for conflicts or ruleset requirements."
          exit 1

  open-production-pr:
    name: Staging → Production (PR for manual approval)
    needs: promote-to-staging
    # Runs after a successful Staging promotion, or when Staging is updated directly
    if: always() && (needs.promote-to-staging.result == 'success' || github.ref_name == 'Staging')
    runs-on: ubuntu-latest
    steps:
      - name: Open PR into Production
        run: |
          set -euo pipefail

          ahead=$(gh api "repos/$GH_REPO/compare/Production...Staging" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "Production already has everything in Staging. Nothing to release."
            exit 0
          fi

          pr=$(gh pr list --base Production --head Staging --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr_url=$(gh pr create --base Production --head Staging \
              --title "Release: Staging → Production" \
              --body "Automated release PR from Staging. Needs team lead approval. Merge with **Create a merge commit** (not squash) so the branches stay in sync.")
            pr="${pr_url##*/}"
            echo "Opened release PR #$pr"
          else
            echo "Release PR #$pr already open; it now includes the latest Staging commits."
          fi

          # PRs opened or updated with GITHUB_TOKEN don't trigger the
          # branch-source-check workflow, so post the required status here.
          # Done every run because new Staging commits change the PR's head commit.
          head_sha=$(gh pr view "$pr" --json headRefOid --jq '.headRefOid')
          gh api "repos/$GH_REPO/statuses/$head_sha" \
            -f state=success -f context="Production source check" \
            -f description="Opened by the promotion workflow from Staging" > /dev/null
