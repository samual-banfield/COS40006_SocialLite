
name: Social Lite Deployment Checks

on:
  push:
    branches:
      - feature/cloudformation-deployment
    paths:
      - "cloudformation/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-template:
    name: Validate CloudFormation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML validator
        run: pip install PyYAML

      - name: Check template exists
        run: test -f cloudformation/template.yaml

      - name: Validate YAML structure
        run: |
          python - <<'PY'
          import yaml

          class CloudFormationLoader(yaml.SafeLoader):
              pass

          def cloudformation_tag(loader, tag_suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  return loader.construct_scalar(node)
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              if isinstance(node, yaml.MappingNode):
                  return loader.construct_mapping(node)
              return None

          CloudFormationLoader.add_multi_constructor("!", cloudformation_tag)

          with open("cloudformation/template.yaml", encoding="utf-8") as file:
              template = yaml.load(file, Loader=CloudFormationLoader)

          assert isinstance(template, dict), "Template must be a YAML mapping"
          assert "Resources" in template, "Template must contain Resources"
          assert "Parameters" in template, "Template must contain Parameters"

          print("CloudFormation YAML structure looks valid.")
          PY

  smoke-test:
    name: Test deployed application
    runs-on: ubuntu-latest
    needs: validate-template

    steps:
      - name: Check application health
        run: |
          APP_URL="http://ec2-18-209-212-78.compute-1.amazonaws.com"

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$APP_URL/health"; then
              echo
              echo "Application health check passed."
              exit 0
            fi

            echo "Attempt $attempt failed. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Application health check failed."
          exit 1

      - name: Test application response
        run: |
          APP_URL="http://ec2-18-209-212-78.compute-1.amazonaws.com"

          RESPONSE=$(curl --fail --silent --show-error "$APP_URL/")

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"application":"Social Lite"'
          echo "$RESPONSE" | grep -q '"status":"running"'

          echo "Application response test passed."
