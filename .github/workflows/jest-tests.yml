# Jest unit & integration tests.
#
# Runs:
#   - on every PR into Development (make "Jest tests" a required check there)
#   - as the first stage of the promotion pipeline (called from promote.yml)

name: Jest tests

on:
    pull_request:
        branches: [Development]
    workflow_call:

permissions:
    contents: read

env:
    APP_DIR: . # TODO: folder that contains package.json, e.g. "app"
    NODE_VERSION: "24" # TODO: match the Node version used in the Dockerfile

jobs:
    jest:
        name: Jest tests
        runs-on: ubuntu-latest

        # TODO (integration tests): uncomment to give Jest a throwaway MySQL database,
        # reachable at 127.0.0.1:3306 from the test steps.
        # services:
        #   mysql:
        #     image: mysql:8.4
        #     env:
        #       MYSQL_ROOT_PASSWORD: test
        #       MYSQL_DATABASE: sociallite_test
        #     ports: ["3306:3306"]
        #     options: >-
        #       --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
        #       --health-interval=5s --health-timeout=5s --health-retries=20

        steps:
            - uses: actions/checkout@v7

            - name: Check for a Node app
              id: app
              run: |
                  if [ -f "$APP_DIR/package.json" ]; then
                    echo "present=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "present=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::No package.json in '$APP_DIR' yet. Skipping tests (stub)."
                  fi

            - name: Set up Node
              if: steps.app.outputs.present == 'true'
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: ${{ hashFiles(format('{0}/package-lock.json', env.APP_DIR)) != '' && 'npm' || '' }}
                  cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

            - name: Install dependencies
              if: steps.app.outputs.present == 'true'
              working-directory: ${{ env.APP_DIR }}
              run: |
                  if [ -f package-lock.json ]; then npm ci; else npm install; fi

            # Quality gate: runs "lint" from package.json if you add one (e.g. "eslint .")
            - name: Lint
              if: steps.app.outputs.present == 'true'
              working-directory: ${{ env.APP_DIR }}
              run: npm run lint --if-present

            # Runs "test" from package.json. Recommended: "test": "jest --ci"
            - name: Unit & integration tests (Jest)
              if: steps.app.outputs.present == 'true'
              working-directory: ${{ env.APP_DIR }}
              env:
                  NODE_ENV: test
                  # TODO (integration tests): point the app at the MySQL service above
                  # DB_HOST: 127.0.0.1
                  # DB_PORT: "3306"
                  # DB_USER: root
                  # DB_PASSWORD: test
                  # DB_NAME: sociallite_test
              run: npm run test --if-present
