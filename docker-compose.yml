# runs the whole app with `docker compose up --build`, see .env.example for the variables it needs
#   frontend  http://localhost:5173 (vite dev server, proxies /api to the backend)
#   backend   http://localhost:3000
#   mysql     localhost:3306 (mysql, data kept in the mysql-data volume)
#   s3        localhost:9090 (S3 mock standing in for the image bucket, files kept in the s3-data volume)

services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
            MYSQL_DATABASE: sociallite
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        # the backend waits on this so it doesn't connect before mysql is accepting connections.
        # pings over tcp because the temporary server mysql runs during first time setup only listens on the socket
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

    # stands in for the S3 bucket on AWS, and creates the bucket when it starts
    s3:
        image: adobe/s3mock:5.2.0
        # the image runs as a non-root user, which can't write to the root owned volume
        user: root
        environment:
            COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: sociallite-images
            COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ap-southeast-2
            COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
            COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
        ports:
            - "9090:9090"
        volumes:
            - s3-data:/data

    backend:
        build: ./backend
        environment:
            # allowPublicKeyRetrieval lets the mariadb driver log in with mysql 8's default auth over a non-tls connection
            DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-password}@mysql:3306/sociallite?allowPublicKeyRetrieval=true
            JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
            IMAGE_BUCKET: sociallite-images
            S3_ENDPOINT: http://s3:9090
            AWS_REGION: ap-southeast-2
            # the mock accepts any credentials, but the AWS SDK won't send a request without some
            AWS_ACCESS_KEY_ID: local
            AWS_SECRET_ACCESS_KEY: local
        ports:
            - "3000:3000"
        depends_on:
            mysql:
                condition: service_healthy
            s3:
                condition: service_started

    frontend:
        build: ./frontend
        environment:
            API_URL: http://backend:3000
        ports:
            - "5173:5173"
        # mount the source so edits hot reload without rebuilding the image
        volumes:
            - ./frontend/src:/app/src
            - ./frontend/public:/app/public
            - ./frontend/index.html:/app/index.html
        depends_on:
            - backend

volumes:
    mysql-data:
    s3-data:
