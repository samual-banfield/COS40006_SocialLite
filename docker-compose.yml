# runs the whole app with `docker compose up --build`, see .env.example for the variables it needs
#   frontend  http://localhost:5173 (vite dev server, proxies /api to the backend)
#   backend   http://localhost:3000
#   mysql     localhost:3306 (mysql, data kept in the mysql-data volume)

services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
            MYSQL_DATABASE: sociallite
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        # the backend waits on this so it doesn't connect before mysql is accepting connections.
        # pings over tcp because the temporary server mysql runs during first time setup only listens on the socket
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

    backend:
        build: ./backend
        environment:
            # allowPublicKeyRetrieval lets the mariadb driver log in with mysql 8's default auth over a non-tls connection
            DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-password}@mysql:3306/sociallite?allowPublicKeyRetrieval=true
            JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
        ports:
            - "3000:3000"
        depends_on:
            mysql:
                condition: service_healthy

    frontend:
        build: ./frontend
        environment:
            API_URL: http://backend:3000
        ports:
            - "5173:5173"
        # mount the source so edits hot reload without rebuilding the image
        volumes:
            - ./frontend/src:/app/src
            - ./frontend/public:/app/public
            - ./frontend/index.html:/app/index.html
        depends_on:
            - backend

volumes:
    mysql-data:
