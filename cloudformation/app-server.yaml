# staging     ImageTag=staging     SeedDatabase=true
# production  ImageTag=production  SeedDatabase=false

# Both stacks are kept and updated in place. On every deploy CloudFormation checks

Parameters:
    # ---- Network and server ----
    VpcId:
        Type: AWS::EC2::VPC::Id
        Description: VPC to run the server and database in

    # Public subnets in at least two availability zones. The load balancer and RDS both need two,
    # and the servers are spread across them, so losing one zone doesn't take the app down.
    SubnetIds:
        Type: List<AWS::EC2::Subnet::Id>
        Description: Public subnets for the load balancer, servers and database, in at least two availability zones

    # Staging uses a single server.
    MinServers:
        Type: Number
        Default: 1
        MinValue: 1

    MaxServers:
        Type: Number
        Default: 1
        MinValue: 1

    # A new image replaces the servers, so production keeps the one it was created with
    AmiId:
        Type: AWS::EC2::Image::Id
        Description: Amazon Linux 2023 image for the server

    # ---- App image ----
    ImageRepository:
        Type: String
        Default: social-lite-app
        Description: ECR repository name

    ImageTag:
        Type: String
        Description: Image tag the server runs

    # ---- Secrets and data ----
    # Letters and numbers only, as symbols break the database URL
    DbPassword:
        Type: String
        NoEcho: true
        MinLength: 8
        MaxLength: 41
        AllowedPattern: "[A-Za-z0-9]+"
        ConstraintDescription: Must be 8 to 41 letters or numbers
        Description: Database password

    JwtSecret:
        Type: String
        NoEcho: true
        MinLength: 16
        Description: Secret used to sign login tokens

    # Seeding replaces all users and posts with test data, so only staging uses it
    SeedDatabase:
        Type: String
        Default: "false"
        AllowedValues: ["true", "false"]
        Description: Reset the database and fill it with test data for every new version

    # ---- Images ----
    # Created by image-bucket.yaml, which the deploy workflows run before this stack
    ImageBucket:
        Type: String
        Description: S3 bucket that stores the images attached to posts

Conditions:
    # Staging's data is thrown away on every release, so it needs no deletion protection
    KeepsData: !Equals [!Ref SeedDatabase, "false"]

Resources:
    # ==== 1. Firewalls ====
    # Rule and tag changes are applied in place.
    # Recreated if: the VPC or a group description changes.

    # Load balancer firewall: allow web traffic in from anywhere
    LoadBalancerSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Allow HTTP traffic to the Social Lite load balancer
            VpcId: !Ref VpcId
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 80
                  ToPort: 80
                  CidrIp: 0.0.0.0/0
            Tags:
                - Key: Name
                  Value: !Sub ${AWS::StackName}-load-balancer

    # Server firewall: only the load balancer can reach the servers
    SecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Allow HTTP traffic to Social Lite
            VpcId: !Ref VpcId
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 80
                  ToPort: 80
                  SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
            Tags:
                - Key: Name
                  Value: !Sub ${AWS::StackName}-servers

    # Database firewall: only the servers can reach the database
    DatabaseSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Allow MySQL traffic from the Social Lite server only
            VpcId: !Ref VpcId
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 3306
                  ToPort: 3306
                  SourceSecurityGroupId: !GetAtt SecurityGroup.GroupId
            Tags:
                - Key: Name
                  Value: !Sub ${AWS::StackName}-database

    # ==== 2. Permissions ====
    # Policy changes are applied in place.
    # Recreated if: the role or profile is given a fixed name or path.

    # Lets the server pull images from ECR, use its own image bucket and report its health
    # check to CloudWatch, and nothing else
    InstanceRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: ec2.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
            Policies:
                - PolicyName: ImageBucketAccess
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                                - s3:DeleteObject
                            Resource: !Sub arn:${AWS::Partition}:s3:::${ImageBucket}/*
                          # Without this, S3 answers "access denied" rather than "not found"
                          # for a missing image. The staging seed also uses it to clear old uploads.
                          - Effect: Allow
                            Action: s3:ListBucket
                            Resource: !Sub arn:${AWS::Partition}:s3:::${ImageBucket}
                - PolicyName: ReportHealth
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # PutMetricData can't be limited to a resource, only to a namespace
                          - Effect: Allow
                            Action: cloudwatch:PutMetricData
                            Resource: "*"
                            Condition:
                                StringEquals:
                                    cloudwatch:namespace: SocialLite

    InstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref InstanceRole

    # ==== 3. Database ====
    # Size, storage, backups and version upgrades are applied in place (some restart the database).
    # Recreated if: the engine, database name, username or encryption changes.
    # A snapshot of the old database is taken before it is deleted.

    DatabaseSubnetGroup:
        Type: AWS::RDS::DBSubnetGroup
        Properties:
            DBSubnetGroupDescription: Subnets the Social Lite database can run in
            SubnetIds: !Ref SubnetIds

    # A snapshot is kept if the database is deleted or has to be replaced
    Database:
        Type: AWS::RDS::DBInstance
        DeletionPolicy: Snapshot
        UpdateReplacePolicy: Snapshot
        # The password comes from a NoEcho parameter, as the server's start up script needs it too
        Metadata:
            cfn-lint:
                config:
                    ignore_checks:
                        - W1011
        Properties:
            Engine: mysql
            # RDS upgrades to newer 8.4 versions by itself, during its maintenance window
            EngineVersion: "8.4.11"
            AutoMinorVersionUpgrade: true
            DBInstanceClass: db.t3.micro
            AllocatedStorage: "20"
            StorageType: gp3
            StorageEncrypted: true
            DBName: sociallite
            MasterUsername: sociallite
            MasterUserPassword: !Ref DbPassword
            DBSubnetGroupName: !Ref DatabaseSubnetGroup
            VPCSecurityGroups:
                - !GetAtt DatabaseSecurityGroup.GroupId
            PubliclyAccessible: false
            MultiAZ: false
            # No automatic backups. Left out, RDS would default to 1 day.
            BackupRetentionPeriod: 0
            DeletionProtection: !If [KeepsData, true, false]
            Tags:
                - Key: Name
                  Value: !Ref AWS::StackName

    # ==== 4. Servers ====
    # Server counts and scaling changes are applied in place.
    # Recreated if: the start up script, AMI, instance type or subnets change. A new group of
    # servers starts, and the old one is only deleted once every new server's app is healthy.

    # How each server is set up. Changing anything makes a new version, and a new
    # version replaces the servers, so the new script always runs.
    ServerLaunchTemplate:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            LaunchTemplateData:
                ImageId: !Ref AmiId
                # The database is on RDS and images are in S3, so only the app runs here. During a
                # deploy the migrations run next to the old app, and the swap added at start up covers that.
                InstanceType: t3.micro
                IamInstanceProfile:
                    Arn: !GetAtt InstanceProfile.Arn
                # Sends CPU and network to CloudWatch every minute instead of every 5, so the
                # staging load test can measure a 2 minute run and scaling reacts sooner
                Monitoring:
                    Enabled: true
                # A public IP lets the server reach ECR, S3 and CloudWatch without a NAT gateway.
                # The firewall still only lets the load balancer in.
                NetworkInterfaces:
                    - AssociatePublicIpAddress: true
                      DeviceIndex: 0
                      Groups:
                          - !Ref SecurityGroup
                # The app reaches the server's IAM role through the instance metadata service.
                # It runs in a Docker container, one network hop further away, so allow 2 hops.
                MetadataOptions:
                    HttpTokens: required
                    HttpPutResponseHopLimit: 2
                # Runs once, when the server first boots
                UserData:
                    Fn::Base64: !Sub |
                        #!/bin/bash
                        # Stop on any error. No -x, so passwords aren't printed to the logs.
                        set -eu
                        # Tell CloudFormation this server failed, so a stack update rolls back straight away
                        trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource ServerGroup --region ${AWS::Region} || true' ERR

                        # 1. Add 1 GB of swap, so a deploy that briefly needs more than the
                        #    t3.micro's 1 GB of memory slows down instead of the app being killed.
                        #    It is listed in fstab so it is kept after a restart.
                        dd if=/dev/zero of=/swapfile bs=1M count=1024 status=none
                        chmod 600 /swapfile
                        mkswap /swapfile > /dev/null
                        swapon /swapfile
                        echo '/swapfile swap swap defaults 0 0' >> /etc/fstab

                        #    Then install Docker, the AWS CLI and cfn-signal
                        dnf install -y docker awscli-2 aws-cfn-bootstrap
                        systemctl enable --now docker

                        # 2. Save the app's settings, used every time the app container starts
                        #    (allowPublicKeyRetrieval lets the app log in to MySQL 8 without TLS)
                        cat > /etc/sociallite.env <<EOF
                        DATABASE_URL=mysql://sociallite:${DbPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/sociallite?allowPublicKeyRetrieval=true
                        JWT_SECRET=${JwtSecret}
                        IMAGE_BUCKET=${ImageBucket}
                        AWS_REGION=${AWS::Region}
                        EOF
                        chmod 600 /etc/sociallite.env

                        # 3. Write the update script. It downloads the image tagged ${ImageTag}
                        #    and, if it is new, updates the database and swaps the app.
                        cat > /usr/local/bin/update-app <<'EOF'
                        #!/bin/bash
                        set -euo pipefail
                        REGISTRY=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
                        IMAGE=$REGISTRY/${ImageRepository}:${ImageTag}

                        aws ecr get-login-password --region ${AWS::Region} |
                          docker login --username AWS --password-stdin $REGISTRY > /dev/null
                        docker pull -q $IMAGE > /dev/null

                        # Stop here if the app is already running this image
                        NEW=$(docker image inspect --format '{{.Id}}' $IMAGE)
                        CURRENT=$(docker inspect --format '{{.Image}}' app 2> /dev/null || echo none)
                        if [ "$NEW" = "$CURRENT" ]; then exit 0; fi
                        echo "Updating the app to $NEW"

                        # Update the database. If this fails, the old app keeps running. Several production
                        # servers can run migrate deploy at once, as Prisma locks the database while it runs.
                        if [ "${SeedDatabase}" = "true" ]; then
                          # Staging: delete everything, rebuild the tables, and add test data
                          docker run --rm --env-file /etc/sociallite.env $IMAGE \
                            sh -c 'npx prisma migrate reset --force && npx prisma db seed'
                        else
                          # Production: apply new migrations only
                          docker run --rm --env-file /etc/sociallite.env $IMAGE \
                            npx prisma migrate deploy
                        fi

                        # Replace the app, with port 80 on the server going to port 3000 in the container
                        docker rm -f app 2> /dev/null || true
                        docker run -d --restart unless-stopped --name app -p 80:3000 \
                          --env-file /etc/sociallite.env $IMAGE

                        # Remove old images so the disk doesn't fill up
                        docker image prune -af > /dev/null
                        EOF
                        chmod +x /usr/local/bin/update-app

                        # 4. Start the app now, then check for a new image every minute.
                        #    A failed update is tried again a minute later.
                        cat > /etc/systemd/system/update-app.service <<'EOF'
                        [Unit]
                        Description=Keep Social Lite on the latest image
                        After=docker.service

                        [Service]
                        ExecStart=/bin/bash -c 'while true; do /usr/local/bin/update-app || echo "Update failed. Trying again in a minute."; sleep 60; done'
                        Restart=always

                        [Install]
                        WantedBy=multi-user.target
                        EOF
                        systemctl enable --now update-app

                        # 5. Write the health check script. It sends CloudWatch:
                        #      HealthCheck        1 if /api/health (which also checks the database) is ok, 0 if not
                        #      MemoryUsedPercent  memory in use, not counting what Linux can free for cache
                        #      DiskUsedPercent    space used on the server's disk
                        #    Response times come from the load balancer, which sees every request.
                        cat > /usr/local/bin/report-health <<'EOF'
                        #!/bin/bash
                        if curl --fail --silent --max-time 10 http://localhost/api/health > /dev/null; then
                          HEALTHY=1
                        else
                          HEALTHY=0
                        fi

                        # MemAvailable comes after MemFree, so it is used when the kernel reports it
                        MEMORY_USED=$(awk '/^MemTotal:/ { total = $2 } /^Mem(Free|Available):/ { free = $2 }
                          END { printf "%.1f", 100 * (1 - free / total) }' /proc/meminfo)
                        DISK_USED=$(df --output=pcent / | tail -1 | tr -dc '0-9')

                        STACK="Dimensions=[{Name=Stack,Value=${AWS::StackName}}]"
                        aws cloudwatch put-metric-data --region ${AWS::Region} --namespace SocialLite --metric-data \
                          "MetricName=HealthCheck,Value=$HEALTHY,$STACK" \
                          "MetricName=MemoryUsedPercent,Unit=Percent,Value=$MEMORY_USED,$STACK" \
                          "MetricName=DiskUsedPercent,Unit=Percent,Value=$DISK_USED,$STACK"
                        EOF
                        chmod +x /usr/local/bin/report-health

                        # 6. Run the health check every minute
                        cat > /etc/systemd/system/report-health.service <<'EOF'
                        [Unit]
                        Description=Report Social Lite's health to CloudWatch
                        After=network-online.target

                        [Service]
                        ExecStart=/bin/bash -c 'while true; do /usr/local/bin/report-health || echo "Could not send the health check to CloudWatch."; sleep 60; done'
                        Restart=always

                        [Install]
                        WantedBy=multi-user.target
                        EOF
                        systemctl enable --now report-health

                        # 7. Tell CloudFormation this server is ready once its app is healthy, waiting
                        #    up to 10 minutes. The first production stack is created before any image is
                        #    tagged production, so with no image yet there is nothing to wait for.
                        if aws ecr describe-images --region ${AWS::Region} --repository-name ${ImageRepository} \
                             --image-ids imageTag=${ImageTag} > /dev/null 2>&1; then
                          for attempt in $(seq 1 60); do
                            if curl --fail --silent --max-time 5 http://localhost/api/health > /dev/null; then break; fi
                            sleep 10
                          done
                          curl --fail --silent --max-time 5 http://localhost/api/health > /dev/null
                        else
                          echo "No image is tagged ${ImageTag} yet. The app will start once one is."
                        fi
                        # Only a stack create or update waits for this, so a server added later ignores it failing
                        /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource ServerGroup --region ${AWS::Region} || true

    # Keeps between MinServers and MaxServers servers running across the subnets. A server whose
    # /api/health fails the load balancer's check is replaced, as is one AWS finds a hardware problem with.
    ServerGroup:
        Type: AWS::AutoScaling::AutoScalingGroup
        # A stack create or update waits for every new server to report a healthy app
        CreationPolicy:
            ResourceSignal:
                Count: !Ref MinServers
                Timeout: PT15M
        # A new launch template version builds a new group of servers next to the old one,
        # and only deletes the old one once the new one is healthy
        UpdatePolicy:
            AutoScalingReplacingUpdate:
                WillReplace: true
        Properties:
            LaunchTemplate:
                LaunchTemplateId: !Ref ServerLaunchTemplate
                Version: !GetAtt ServerLaunchTemplate.LatestVersionNumber
            MinSize: !Ref MinServers
            MaxSize: !Ref MaxServers
            VPCZoneIdentifier: !Ref SubnetIds
            TargetGroupARNs:
                - !Ref TargetGroup
            HealthCheckType: ELB
            # A new server needs time to install Docker, download the image and update the database
            HealthCheckGracePeriod: 900
            # Shown in the EC2 console's Name column: social-lite-staging or social-lite-production
            Tags:
                - Key: Name
                  Value: !Ref AWS::StackName
                  PropagateAtLaunch: true

    # Adds servers when average CPU stays above 60%, and removes them when it drops, between
    # MinServers and MaxServers. Staging's minimum and maximum are both 1, so it never scales.
    # This makes its own TargetTracking- alarms, which are meant to sit in ALARM while CPU is low.
    ScalingPolicy:
        Type: AWS::AutoScaling::ScalingPolicy
        Properties:
            AutoScalingGroupName: !Ref ServerGroup
            PolicyType: TargetTrackingScaling
            TargetTrackingConfiguration:
                PredefinedMetricSpecification:
                    PredefinedMetricType: ASGAverageCPUUtilization
                TargetValue: 60

    # ==== 5. Load balancer ====
    # All changes are applied in place.
    # Recreated if: the subnets change, which gives the app a new web address.

    # The app's fixed web address. It only sends requests to servers whose /api/health passes.
    LoadBalancer:
        Type: AWS::ElasticLoadBalancingV2::LoadBalancer
        Properties:
            Scheme: internet-facing
            Subnets: !Ref SubnetIds
            SecurityGroups:
                - !Ref LoadBalancerSecurityGroup
            Tags:
                - Key: Name
                  Value: !Ref AWS::StackName

    # A server is taken out after failing 3 checks in a row (45 seconds), and put back after passing 2
    TargetGroup:
        Type: AWS::ElasticLoadBalancingV2::TargetGroup
        Properties:
            VpcId: !Ref VpcId
            Protocol: HTTP
            Port: 80
            TargetType: instance
            HealthCheckPath: /api/health
            HealthCheckIntervalSeconds: 15
            HealthCheckTimeoutSeconds: 5
            HealthyThresholdCount: 2
            UnhealthyThresholdCount: 3
            Matcher:
                HttpCode: "200"
            # Requests already in progress get 30 seconds to finish when a server is removed
            TargetGroupAttributes:
                - Key: deregistration_delay.timeout_seconds
                  Value: "30"

    Listener:
        Type: AWS::ElasticLoadBalancingV2::Listener
        Properties:
            LoadBalancerArn: !Ref LoadBalancer
            Port: 80
            Protocol: HTTP
            DefaultActions:
                - Type: forward
                  TargetGroupArn: !Ref TargetGroup

    # ==== 6. Monitoring ====

    # Alarm when the servers' average CPU stays above 80% for 10 minutes
    CPUAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite server CPU is high
            Namespace: AWS/EC2
            MetricName: CPUUtilization
            Dimensions:
                - Name: AutoScalingGroupName
                  Value: !Ref ServerGroup
            Statistic: Average
            Period: 300
            EvaluationPeriods: 2
            Threshold: 80
            ComparisonOperator: GreaterThanThreshold

    # Alarm when fewer healthy servers than MinServers have been behind the load balancer for 3 minutes.
    HealthyServersAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite has fewer healthy servers than it should
            Namespace: AWS/ApplicationELB
            MetricName: HealthyHostCount
            Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancer.LoadBalancerFullName
                - Name: TargetGroup
                  Value: !GetAtt TargetGroup.TargetGroupFullName
            Statistic: Minimum
            Period: 60
            EvaluationPeriods: 3
            Threshold: !Ref MinServers
            ComparisonOperator: LessThanThreshold
            TreatMissingData: breaching

    # Alarm when the app or its database has been down for 3 minutes
    HealthCheckAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite is down, /api/health is failing or not being reported
            Namespace: SocialLite
            MetricName: HealthCheck
            Dimensions:
                - Name: Stack
                  Value: !Ref AWS::StackName
            Statistic: Maximum
            Period: 60
            EvaluationPeriods: 3
            Threshold: 1
            ComparisonOperator: LessThanThreshold
            TreatMissingData: breaching

    # Alarm when requests have averaged over 1 second for 5 minutes
    ResponseTimeAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite is responding slowly
            Namespace: AWS/ApplicationELB
            MetricName: TargetResponseTime
            Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancer.LoadBalancerFullName
            Statistic: Average
            Period: 60
            EvaluationPeriods: 5
            Threshold: 1
            ComparisonOperator: GreaterThanThreshold

    # Alarm when the app has returned more than 10 server errors in 5 minutes.
    ServerErrorsAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite is returning server errors
            Namespace: AWS/ApplicationELB
            MetricName: HTTPCode_Target_5XX_Count
            Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancer.LoadBalancerFullName
            Statistic: Sum
            Period: 300
            EvaluationPeriods: 1
            Threshold: 10
            ComparisonOperator: GreaterThanThreshold
            TreatMissingData: notBreaching

    # Alarm when any server has had over 90% of its memory in use for 5 minutes.
    MemoryAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite server is low on memory
            Namespace: SocialLite
            MetricName: MemoryUsedPercent
            Dimensions:
                - Name: Stack
                  Value: !Ref AWS::StackName
            Statistic: Maximum
            Period: 60
            EvaluationPeriods: 5
            Threshold: 90
            ComparisonOperator: GreaterThanThreshold

    # Alarm when any server's disk is over 85% full.
    DiskAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite server disk is almost full
            Namespace: SocialLite
            MetricName: DiskUsedPercent
            Dimensions:
                - Name: Stack
                  Value: !Ref AWS::StackName
            Statistic: Maximum
            Period: 300
            EvaluationPeriods: 1
            Threshold: 85
            ComparisonOperator: GreaterThanThreshold

    # Alarm when the database has less than 2 GB (10%) of storage left.
    DatabaseStorageAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite database is almost out of storage
            Namespace: AWS/RDS
            MetricName: FreeStorageSpace
            Dimensions:
                - Name: DBInstanceIdentifier
                  Value: !Ref Database
            Statistic: Minimum
            Period: 300
            EvaluationPeriods: 1
            Threshold: 2147483648
            ComparisonOperator: LessThanThreshold

    # Alarm when the database has had less than 25 MB of memory free for 10 minutes. MySQL keeps
    # about 3/4 of the 1 GB for its cache, so 50-60 MB free is normal on a db.t3.micro.
    DatabaseMemoryAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite database is low on memory
            Namespace: AWS/RDS
            MetricName: FreeableMemory
            Dimensions:
                - Name: DBInstanceIdentifier
                  Value: !Ref Database
            Statistic: Average
            Period: 300
            EvaluationPeriods: 2
            Threshold: 26214400
            ComparisonOperator: LessThanThreshold

    # Alarm when the database's average CPU stays above 80% for 10 minutes
    DatabaseCPUAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite database CPU is high
            Namespace: AWS/RDS
            MetricName: CPUUtilization
            Dimensions:
                - Name: DBInstanceIdentifier
                  Value: !Ref Database
            Statistic: Average
            Period: 300
            EvaluationPeriods: 2
            Threshold: 80
            ComparisonOperator: GreaterThanThreshold

    # Alarm when more than 50 connections are open for 10 minutes.
    DatabaseConnectionsAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite database has too many open connections
            Namespace: AWS/RDS
            MetricName: DatabaseConnections
            Dimensions:
                - Name: DBInstanceIdentifier
                  Value: !Ref Database
            Statistic: Maximum
            Period: 300
            EvaluationPeriods: 2
            Threshold: 50
            ComparisonOperator: GreaterThanThreshold

Outputs:
    AppURL:
        Description: Social Lite web address
        Value: !Sub "http://${LoadBalancer.DNSName}"

    DatabaseEndpoint:
        Description: Database address, only reachable from the servers
        Value: !GetAtt Database.Endpoint.Address

    # Used by the staging load test to look up the servers', load balancer's and database's metrics
    ServerGroupName:
        Description: Auto Scaling group the servers run in
        Value: !Ref ServerGroup

    LoadBalancerFullName:
        Description: Load balancer name as CloudWatch metrics use it
        Value: !GetAtt LoadBalancer.LoadBalancerFullName

    DatabaseId:
        Description: RDS instance identifier
        Value: !Ref Database
