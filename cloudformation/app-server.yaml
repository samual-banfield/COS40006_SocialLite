# staging     ImageTag=staging     SeedDatabase=true
# production  ImageTag=production  SeedDatabase=false

# Both stacks are kept and updated in place. On every deploy CloudFormation checks

Parameters:
    # ---- Network and server ----
    VpcId:
        Type: AWS::EC2::VPC::Id
        Description: VPC to run the server and database in

    # Must be a public subnet inside the VPC above
    SubnetId:
        Type: AWS::EC2::Subnet::Id
        Description: Public subnet for the server

    # RDS needs subnets in at least two availability zones, even for a single database
    DbSubnetIds:
        Type: List<AWS::EC2::Subnet::Id>
        Description: Subnets the database can run in, in at least two availability zones

    # A new image replaces the server, so production keeps the one it was created with
    AmiId:
        Type: AWS::EC2::Image::Id
        Description: Amazon Linux 2023 image for the server

    # ---- App image ----
    ImageRepository:
        Type: String
        Default: social-lite-app
        Description: ECR repository name

    ImageTag:
        Type: String
        Description: Image tag the server runs

    # ---- Secrets and data ----
    # Letters and numbers only, as symbols break the database URL
    DbPassword:
        Type: String
        NoEcho: true
        MinLength: 8
        MaxLength: 41
        AllowedPattern: "[A-Za-z0-9]+"
        ConstraintDescription: Must be 8 to 41 letters or numbers
        Description: Database password

    JwtSecret:
        Type: String
        NoEcho: true
        MinLength: 16
        Description: Secret used to sign login tokens

    # Seeding replaces all users and posts with test data, so only staging uses it
    SeedDatabase:
        Type: String
        Default: "false"
        AllowedValues: ["true", "false"]
        Description: Reset the database and fill it with test data for every new version

    # ---- Images ----
    # Created by image-bucket.yaml, which the deploy workflows run before this stack
    ImageBucket:
        Type: String
        Description: S3 bucket that stores the images attached to posts

Conditions:
    # Staging's data is thrown away on every release, so it needs no deletion protection
    KeepsData: !Equals [!Ref SeedDatabase, "false"]

Resources:
    # ==== 1. Firewalls ====
    # Rule changes are applied in place.
    # Recreated if: the VPC or a group description changes.

    # Server firewall: only allow web traffic in
    SecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Allow HTTP traffic to Social Lite
            VpcId: !Ref VpcId
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 80
                  ToPort: 80
                  CidrIp: 0.0.0.0/0

    # Database firewall: only the server can reach the database
    DatabaseSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Allow MySQL traffic from the Social Lite server only
            VpcId: !Ref VpcId
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 3306
                  ToPort: 3306
                  SourceSecurityGroupId: !GetAtt SecurityGroup.GroupId

    # ==== 2. Permissions ====
    # Policy changes are applied in place.
    # Recreated if: the role or profile is given a fixed name or path.

    # Lets the server pull images from ECR and use its own image bucket, and nothing else
    InstanceRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: ec2.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
            Policies:
                - PolicyName: ImageBucketAccess
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                                - s3:DeleteObject
                            Resource: !Sub arn:${AWS::Partition}:s3:::${ImageBucket}/*
                          # Without this, S3 answers "access denied" rather than "not found"
                          # for a missing image. The staging seed also uses it to clear old uploads.
                          - Effect: Allow
                            Action: s3:ListBucket
                            Resource: !Sub arn:${AWS::Partition}:s3:::${ImageBucket}

    InstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref InstanceRole

    # ==== 3. Database ====
    # Size, storage, backups and version upgrades are applied in place (some restart the database).
    # Recreated if: the engine, database name, username or encryption changes.
    # A snapshot of the old database is taken before it is deleted.

    DatabaseSubnetGroup:
        Type: AWS::RDS::DBSubnetGroup
        Properties:
            DBSubnetGroupDescription: Subnets the Social Lite database can run in
            SubnetIds: !Ref DbSubnetIds

    # A snapshot is kept if the database is deleted or has to be replaced
    Database:
        Type: AWS::RDS::DBInstance
        DeletionPolicy: Snapshot
        UpdateReplacePolicy: Snapshot
        # The password comes from a NoEcho parameter, as the server's start up script needs it too
        Metadata:
            cfn-lint:
                config:
                    ignore_checks:
                        - W1011
        Properties:
            Engine: mysql
            # RDS upgrades to newer 8.4 versions by itself, during its maintenance window
            EngineVersion: "8.4.11"
            AutoMinorVersionUpgrade: true
            DBInstanceClass: db.t3.micro
            AllocatedStorage: "20"
            StorageType: gp3
            StorageEncrypted: true
            DBName: sociallite
            MasterUsername: sociallite
            MasterUserPassword: !Ref DbPassword
            DBSubnetGroupName: !Ref DatabaseSubnetGroup
            VPCSecurityGroups:
                - !GetAtt DatabaseSecurityGroup.GroupId
            PubliclyAccessible: false
            MultiAZ: false
            # No automatic backups. Left out, RDS would default to 1 day.
            BackupRetentionPeriod: 0
            DeletionProtection: !If [KeepsData, true, false]
            Tags:
                - Key: Name
                  Value: !Ref AWS::StackName

    # ==== 4. Server ====
    # Tag changes are applied in place. An instance type change stops and starts the server.
    # Recreated if: the start up script, AMI or subnet changes. The new server
    # starts before the old one is deleted, and gets a new public IP.

    # Holds the server's start up script. Changing the script makes a new version,
    # and a new version replaces the server, so the new script always runs.
    ServerLaunchTemplate:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            LaunchTemplateData:
                # The app reaches the server's IAM role through the instance metadata service.
                # It runs in a Docker container, one network hop further away, so allow 2 hops.
                MetadataOptions:
                    HttpTokens: required
                    HttpPutResponseHopLimit: 2
                # Runs once, when the server first boots
                UserData:
                    Fn::Base64: !Sub |
                        #!/bin/bash
                        # Stop on any error. No -x, so passwords aren't printed to the logs.
                        set -eu

                        # 1. Install Docker and the AWS CLI
                        dnf install -y docker awscli-2
                        systemctl enable --now docker

                        # 2. Save the app's settings, used every time the app container starts
                        #    (allowPublicKeyRetrieval lets the app log in to MySQL 8 without TLS)
                        cat > /etc/sociallite.env <<EOF
                        DATABASE_URL=mysql://sociallite:${DbPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/sociallite?allowPublicKeyRetrieval=true
                        JWT_SECRET=${JwtSecret}
                        IMAGE_BUCKET=${ImageBucket}
                        AWS_REGION=${AWS::Region}
                        EOF
                        chmod 600 /etc/sociallite.env

                        # 3. Write the update script. It downloads the image tagged ${ImageTag}
                        #    and, if it is new, updates the database and swaps the app.
                        cat > /usr/local/bin/update-app <<'EOF'
                        #!/bin/bash
                        set -euo pipefail
                        REGISTRY=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
                        IMAGE=$REGISTRY/${ImageRepository}:${ImageTag}

                        aws ecr get-login-password --region ${AWS::Region} |
                          docker login --username AWS --password-stdin $REGISTRY > /dev/null
                        docker pull -q $IMAGE > /dev/null

                        # Stop here if the app is already running this image
                        NEW=$(docker image inspect --format '{{.Id}}' $IMAGE)
                        CURRENT=$(docker inspect --format '{{.Image}}' app 2> /dev/null || echo none)
                        if [ "$NEW" = "$CURRENT" ]; then exit 0; fi
                        echo "Updating the app to $NEW"

                        # Update the database. If this fails, the old app keeps running.
                        if [ "${SeedDatabase}" = "true" ]; then
                          # Staging: delete everything, rebuild the tables, and add test data
                          docker run --rm --env-file /etc/sociallite.env $IMAGE \
                            sh -c 'npx prisma migrate reset --force && npx prisma db seed'
                        else
                          # Production: apply new migrations only
                          docker run --rm --env-file /etc/sociallite.env $IMAGE \
                            npx prisma migrate deploy
                        fi

                        # Replace the app, with port 80 on the server going to port 3000 in the container
                        docker rm -f app 2> /dev/null || true
                        docker run -d --restart unless-stopped --name app -p 80:3000 \
                          --env-file /etc/sociallite.env $IMAGE

                        # Remove old images so the disk doesn't fill up
                        docker image prune -af > /dev/null
                        EOF
                        chmod +x /usr/local/bin/update-app

                        # 4. Start the app now, then check for a new image every minute.
                        #    A failed update is tried again a minute later.
                        cat > /etc/systemd/system/update-app.service <<'EOF'
                        [Unit]
                        Description=Keep Social Lite on the latest image
                        After=docker.service

                        [Service]
                        ExecStart=/bin/bash -c 'while true; do /usr/local/bin/update-app || echo "Update failed. Trying again in a minute."; sleep 60; done'
                        Restart=always

                        [Install]
                        WantedBy=multi-user.target
                        EOF
                        systemctl enable --now update-app

    Server:
        Type: AWS::EC2::Instance
        Properties:
            ImageId: !Ref AmiId
            # Small rather than micro, so there is enough memory to run migrations next to the app
            InstanceType: t3.small
            IamInstanceProfile: !Ref InstanceProfile
            LaunchTemplate:
                LaunchTemplateId: !Ref ServerLaunchTemplate
                Version: !GetAtt ServerLaunchTemplate.LatestVersionNumber
            NetworkInterfaces:
                - AssociatePublicIpAddress: true
                  DeviceIndex: "0"
                  GroupSet:
                      - !Ref SecurityGroup
                  SubnetId: !Ref SubnetId
            # Shown in the EC2 console's Name column: social-lite-staging or social-lite-production.
            # Changing tags doesn't replace the server.
            Tags:
                - Key: Name
                  Value: !Ref AWS::StackName

    # ==== 5. Monitoring ====
    # All changes are applied in place, including pointing at a recreated server.

    # Alarm when average CPU stays above 80% for 10 minutes (two 5 minute checks)
    CPUAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmDescription: Social Lite server CPU is high
            Namespace: AWS/EC2
            MetricName: CPUUtilization
            Dimensions:
                - Name: InstanceId
                  Value: !Ref Server
            Statistic: Average
            Period: 300
            EvaluationPeriods: 2
            Threshold: 80
            ComparisonOperator: GreaterThanThreshold

Outputs:
    AppURL:
        Description: Social Lite web address
        Value: !Sub "http://${Server.PublicIp}"

    DatabaseEndpoint:
        Description: Database address, only reachable from the server
        Value: !GetAtt Database.Endpoint.Address
